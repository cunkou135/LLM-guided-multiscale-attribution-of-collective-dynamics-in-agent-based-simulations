[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abms-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mesa[viz]==3.5.2", "PyYAML>=6,<7", "pyarrow>=18,<23", "pandas>=2,<3", "numpy>=1.26,<3", "plotly==5.24.1", "networkx>=3.2,<4", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "psutil>=5.9,<8"]
causal = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["simulations*", "visualization*", "examples*", "experiments*", "scenarios*", "causal_graph*"]
exclude = ["causal_graph.results*", "causal_graph.examples*", "causal_graph.docs*", "causal_graph.sandbox*"]
namespaces = true

[tool.setuptools.package-data]
scenarios = ["*.md", "*.yaml", "SHA256SUMS", "v2/*.md"]
visualization = ["*.vue", "*.css"]
causal_graph = ["configs/*.yaml", "docs/*.md", "sandbox/Dockerfile", "requirements-lock.txt", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "causal_graph/tests"]
