[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abms-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mesa[viz]==3.5.2", "PyYAML>=6,<7", "pyarrow>=18,<23", "pandas>=2,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["simulations*", "visualization*", "examples*", "experiments*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
