# API key is read from the environment, never from this file.
default_profile: deepseek_flash
profiles:
  deepseek_flash:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.3
    top_p: null
    max_tokens: 32768
    timeout: 600
    max_retries: 1
    reasoning_effort: low
    stream: true
    extra_body:
      stream_options:
        include_usage: true
