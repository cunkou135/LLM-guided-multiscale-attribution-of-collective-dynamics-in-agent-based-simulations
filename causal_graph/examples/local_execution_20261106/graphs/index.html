   <title>elong_macro_global_eigen_ratio → elong_meso_local_eigen_ratio
downward
School-wide anisotropic stretching changes how local contact neighborhoods are embedded in the group: when the global position covariance is elongated, differential motion and contact rearrangement can transmit that anisotropy into local neighborhoods, making their covariance more elongated. This is not a deterministic aggregation because local contact sets and boundary effects vary independently.</title></g>

   <title>frag_macro_largest_component_fraction → elong_meso_local_eigen_ratio
downward
A high largest-component fraction indicates a cohesive connected school whose local contact neighborhoods are constrained by many neighboring fish, tending to reduce local anisotropic stretching. As the largest fraction falls and the school breaks into clusters, local neighborhoods near boundaries or isolated groups can stretch more freely, increasing local elongation ratios.</title></g>

   <title>elong_macro_global_eigen_ratio → frag_meso_contact_component_count
downward
Global elongation along a principal axis can separate fish that were previously in contact, especially across the stretched direction, thereby breaking native contact links and increasing the number of contact-graph components. The effect is dynamic and not definitional because elongation does not determine which contacts persist.</title></g>

   <title>frag_meso_contact_component_count → frag_micro_nn_distance
downward
When the fish contact graph splits into more components, individual fish are less likely to be held within a dense common neighborhood; this can allow local nearest-neighbor spacing to increase as fish adjust to sparse or disconnected local groups. The relation is probabilistic because contact components and metric nearest-neighbor distances are not the same representation.</title></g>

   <title>elong_meso_local_eigen_ratio → elong_micro_axis_alignment

An elongated local contact neighborhood provides a directional social configuration: alignment and attraction toward neighbors can bias a focal fish to head along the local stretch axis. Thus meso-level local anisotropy can influence micro-level heading alignment with the group principal axis, without making that alignment deterministic.</title></g>

   <title>frag_macro_largest_component_fraction → frag_micro_nn_distance
downward
A declining largest-component fraction means the school is increasingly concentrated in smaller components or isolated groups; fish outside the dominant connected cluster experience weaker collective spacing constraints and can exhibit larger nearest-neighbor gaps. This is a plausible macro-to-micro dynamic effect rather than a direct definition, since nearest-neighbor distance is measured independently of graph membership.</title></g>

   <title>frag_micro_nn_distance → frag_meso_contact_component_count
upward
局部最近邻间距改变鱼之间形成接触边的概率：当许多鱼彼此远离时，原生接触图更易断开，从而增加连通分量数；该关系依赖空间排布而非由定义直接决定。</title></g>

   <title>frag_micro_nn_distance → frag_macro_largest_component_fraction
upward
个体局部间距增大会削弱跨邻域接触链，使最大连通分量占比可能下降；但若存在少数稠密核心，影响可被缓冲，因此不是确定性聚合。</title></g>

   <title>frag_meso_contact_component_count → frag_macro_largest_component_fraction
upward
鱼群分裂为更多连通分量时，最大分量占比通常可能降低；但多分量可包含一个主导核心，故这是动态结构候选而非代数恒等。</title></g>

   <title>elong_micro_axis_alignment → elong_macro_global_eigen_ratio
upward
大量个体沿群体主轴对齐时，定向游动可能累积为整体位置分布的各向异性拉伸；个体转向上限和随机扰动使对齐不必然转化为等比例全局拉伸。</title></g>

   <title>elong_macro_global_eigen_ratio → frag_meso_contact_component_count
downward
Global elongation along a principal axis can separate fish that were previously in contact, especially across the stretched direction, thereby breaking native contact links and increasing the number of contact-graph components. The effect is dynamic and not definitional because elongation does not determine which contacts persist.</title></g>

   <title>frag_meso_contact_component_count → frag_micro_nn_distance
downward
When the fish contact graph splits into more components, individual fish are less likely to be held within a dense common neighborhood; this can allow local nearest-neighbor spacing to increase as fish adjust to sparse or disconnected local groups. The relation is probabilistic because contact components and metric nearest-neighbor distances are not the same representation.</title></g>

A declining largest-component fraction means the school is increasingly concentrated in smaller components or isolated groups; fish outside the dominant connected cluster experience weaker collective spacing constraints and can exhibit larger nearest-neighbor gaps. This is a plausible macro-to-micro dynamic effect rather than a direct definition, since nearest-neighbor distance is measured independently of graph membership.</title></g>

   <title>elong_macro_global_eigen_ratio → elong_meso_local_eigen_ratio
downward
School-wide anisotropic stretching changes how local contact neighborhoods are embedded in the group: when the global position covariance is elongated, differential motion and contact rearrangement can transmit that anisotropy into local neighborhoods, making their covariance more elongated. This is not a deterministic aggregation because local contact sets and boundary effects vary independently.</title></g>

   <title>frag_macro_largest_component_fraction → elong_meso_local_eigen_ratio
downward
A high largest-component fraction indicates a cohesive connected school whose local contact neighborhoods are constrained by many neighboring fish, tending to reduce local anisotropic stretching. As the largest fraction falls and the school breaks into clusters, local neighborhoods near boundaries or isolated groups can stretch more freely, increasing local elongation ratios.</title></g>

   <title>elong_macro_global_eigen_ratio → frag_meso_contact_component_count
downward
Global elongation along a principal axis can separate fish that were previously in contact, especially across the stretched direction, thereby breaking native contact links and increasing the number of contact-graph components. The effect is dynamic and not definitional because elongation does not determine which contacts persist.</title></g>

   <title>frag_meso_contact_component_count → frag_micro_nn_distance
downward
When the fish contact graph splits into more components, individual fish are less likely to be held within a dense common neighborhood; this can allow local nearest-neighbor spacing to increase as fish adjust to sparse or disconnected local groups. The relation is probabilistic because contact components and metric nearest-neighbor distances are not the same representation.</title></g>

   <title>elong_meso_local_eigen_ratio → elong_micro_axis_alignment
downward
An elongated local contact neighborhood provides a directional social configuration: alignment and attraction toward neighbors can bias a focal fish to head along the local stretch axis. Thus meso-level local anisotropy can influence micro-level heading alignment with the group principal axis, without making that alignment deterministic.</title></g>

   <title>frag_macro_largest_component_fraction → frag_micro_nn_distance
downward
A declining largest-component fraction means the school is increasingly concentrated in smaller components or isolated groups; fish outside the dominant connected cluster experience weaker collective spacing constraints and can exhibit larger nearest-neighbor gaps. This is a plausible macro-to-micro dynamic effect rather than a direct definition, since nearest-neighbor distance is measured independently of graph membership.</title></g>

   <title>frag_micro_nn_distance → elong_micro_axis_alignment
intra_scale
A fish with larger nearest-neighbor spacing has weaker local social constraint from nearby schoolmates; over subsequent steps its heading may be less entrained by the group's principal axis, so its absolute axis alignment can change. This is a dynamic micro-level candidate effect rather than a definitional aggregation.</title></g>

   <title>elong_meso_local_eigen_ratio → frag_meso_contact_component_count
intra_scale
Anisotropic local contact-neighborhood geometry can reflect stretching along one direction that breaks lateral contacts; as local neighborhoods become more elongated, the contact graph may later split into more components. This is a plausible meso-level dynamic relation mediated by changing contacts, not a direct aggregation of the same quantity.</title></g>

   <title>elong_macro_global_eigen_ratio → frag_macro_largest_component_fraction
intra_scale
Greater global position elongation spreads fish along a major axis and can push some pairwise distances beyond contact range, which may reduce the fraction of fish remaining in the largest contact component. The candidate effect is mediated by contact formation and is not a definitional identity between the two macro indicators.</title></g>

   <title>frag_micro_nn_distance → frag_meso_contact_component_count
upward
局部最近邻间距改变鱼之间形成接触边的概率：当许多鱼彼此远离时，原生接触图更易断开，从而增加连通分量数；该关系依赖空间排布而非由定义直接决定。</title></g>

   <title>frag_micro_nn_distance → frag_macro_largest_component_fraction
upward
个体局部间距增大会削弱跨邻域接触链，使最大连通分量占比可能下降；但若存在少数稠密核心，影响可被缓冲，因此不是确定性聚合。</title></g>

   <title>frag_meso_contact_component_count → frag_macro_largest_component_fraction
upward
鱼群分裂为更多连通分量时，最大分量占比通常可能降低；但多分量可包含一个主导核心，故这是动态结构候选而非代数恒等。</title></g>

upward
大量个体沿群体主轴对齐时，定向游动可能累积为整体位置分布的各向异性拉伸；个体转向上限和随机扰动使对齐不必然转化为等比例全局拉伸。</title></g>

   <title>elong_macro_global_eigen_ratio → frag_meso_contact_component_count
downward
Global elongation along a principal axis can separate fish that were previously in contact, especially across the stretched direction, thereby breaking native contact links and increasing the number of contact-graph components. The effect is dynamic and not definitional because elongation does not determine which contacts persist.</title></g>
   <g id="edge_downward__frag_components_to_nn_distance" class="inspectable">
    <path d="M 268.89663 114.649615  Q 248.514968 113.457296 229.249431 114.584451  " clip-path="url(#p0718152d2b)" style="fill: none; stroke-dasharray: 3.7,1.6; stroke-dashoffset: 0; stroke: #b3653b; stroke-linecap: round" />

   <title>frag_meso_contact_component_count → frag_micro_nn_distance
downward
When the fish contact graph splits into more components, individual fish are less likely to be held within a dense common neighborhood; this can allow local nearest-neighbor spacing to increase as fish adjust to sparse or disconnected local groups. The relation is probabilistic because contact components and metric nearest-neighbor distances are not the same representation.</title></g>
   <g id="edge_downward__frag_macro_to_nn_distance" class="inspectable">
    <path d="M 503.584644 87.51973  Q 359.99763 24.642986 217.434755 87.07332  " clip-path="url(#p0718152d2b)" style="fill: none; stroke-dasharray: 3.7,1.6; stroke-dashoffset: 0; stroke: #b3653b; stroke-linecap: round" />
    <path d="M 222.347736 87.323555  L 217.434755 87.07332  L 220.582732 83.293076  z " clip-path="url(#p0718152d2b)" style="fill: #b3653b; stroke-dasharray: 3.7,1.6; stroke-dashoffset: 0; stroke: #b3653b; stroke-linecap: round" />
   <title>frag_macro_largest_component_fraction → frag_micro_nn_distance
downward
A declining largest-component fraction means the school is increasingly concentrated in smaller components or isolated groups; fish outside the dominant connected cluster experience weaker collective spacing constraints and can exhibit larger nearest-neighbor gaps. This is a plausible macro-to-micro dynamic effect rather than a direct definition, since nearest-neighbor distance is measured independently of graph membership.</title></g>
   <g id="edge_intra_scale__micro_nn_spacing_to_axis_alignment" class="inspectable">

   <title>frag_micro_nn_distance → elong_micro_axis_alignment
intra_scale
A fish with larger nearest-neighbor spacing has weaker local social constraint from nearby schoolmates; over subsequent steps its heading may be less entrained by the group's principal axis, so its absolute axis alignment can change. This is a dynamic micro-level candidate effect rather than a definitional aggregation.</title></g>

   <title>elong_macro_global_eigen_ratio → frag_macro_largest_component_fraction
intra_scale
Greater global position elongation spreads fish along a major axis and can push some pairwise distances beyond contact range, which may reduce the fraction of fish remaining in the largest contact component. The candidate effect is mediated by contact formation and is not a definitional identity between the two macro indicators.</title></g>

   <title>sic_micro_prior_setting_degree → sic_meso_layer_infection_contact_ratio
upward
Infected agents with higher prior same-setting contact degree are more embedded in dense layer-specific contact structures; their subsequent interactions can generate more same-layer infection events per observed contact row, shifting the meso layer infection-to-contact ratio beyond simple event aggregation.</title></g>
   <g id="edge_upward__edge_icts_micro_quarantine_ratio_to_meso_layer_contact_change" class="inspectable">
    <path d="M 228.135628 312.506748  Q 248.51729 313.699067 267.782827 312.571913  " clip-path="url(#p653fc2883c)" style="fill: none; stroke: #27667b; stroke-linecap: round" />
    <path d="M 263.261844 310.632657  L 267.782827 312.571913  L 263.518832 315.025145  z " clip-path="url(#p653fc2883c)" style="fill: #27667b; stroke: #27667b; stroke-linecap: round" />
   <title>icts_micro_quarantine_contact_ratio → icts_meso_layer_contact_change
upward
When quarantined agents retain a larger share of their pre-onset contacts, layer-level contact volume around quarantine-count increases declines less; widespread low post/pre contact ratios instead amplify layer contact-volume contraction.</title></g>
   <g id="edge_upward__edge_sic_meso_layer_ratio_to_macro_layer_entropy" class="inspectable">
    <path d="M 451.10337 149.132203  Q 471.485032 150.324522 490.750569 149.197367  " clip-path="url(#p653fc2883c)" style="fill: none; stroke: #27667b; stroke-linecap: round" />
    <path d="M 486.229586 147.258111  L 490.750569 149.197367  L 486.486574 151.6506  z " clip-path="url(#p653fc2883c)" style="fill: #27667b; stroke: #27667b; stroke-linecap: round" />
   <title>sic_meso_layer_infection_contact_ratio → sic_macro_layer_entropy
upward
Differential infection-to-contact intensity across layers changes the relative share of infection events attributed to each layer; an elevated ratio in one layer can make city infection events more concentrated, while more balanced ratios across layers can diversify the city-level layer distribution.</title></g>
   <g id="edge_upward__edge_icts_meso_layer_contact_change_to_macro_layer_entropy" class="inspectable">
    <path d="M 450.545839 253.9508  Q 502.952268 222.659292 544.486913 178.389737  " clip-path="url(#p653fc2883c)" style="fill: none; stroke: #27667b; stroke-linecap: round" />
    <path d="M 539.871936 180.093259  L 544.486913 178.389737  L 543.080744 183.103832  z " clip-path="url(#p653fc2883c)" style="fill: #27667b; stroke: #27667b; stroke-linecap: round" />
   <title>icts_meso_layer_contact_change → sic_macro_layer_entropy
upward
Quarantine-associated contact-volume contractions that differ by layer redistribute mixing opportunities among settings, which can shift transmission toward less-contracted layers and thereby reshape the city-level distribution of infection events across layers.</title></g>
   <g id="edge_upward__edge_sic_micro_degree_to_macro_layer_entropy" class="inspectable">
    <path d="M 216.415356 176.262089  Q 360.00237 239.138832 502.565245 176.708498  " clip-path="url(#p653fc2883c)" style="fill: none; stroke: #27667b; stroke-linecap: round" />
    <path d="M 497.652264 176.458264  L 502.565245 176.708498  L 499.417268 180.488742  z " clip-path="url(#p653fc2883c)" style="fill: #27667b; stroke: #27667b; stroke-linecap: round" />
   <title>sic_micro_prior_setting_degree → sic_macro_layer_entropy
upward
Heterogeneous prior contact embeddedness of infected agents across settings can create layer-specific infection clustering; when high-degree infections concentrate in particular layers, the city-wide infection-event distribution across layers can become more skewed, altering normalized layer entropy.</title></g>
   <g id="edge_upward__edge_icts_micro_quarantine_ratio_to_macro_city_contact_change" class="inspectable">
    <path d="M 216.415356 339.636634  Q 360.00237 402.513377 502.565245 340.083044  " clip-path="url(#p653fc2883c)" style="fill: none; stroke: #27667b; stroke-linecap: round" />
    <path d="M 497.652264 339.832809  L 502.565245 340.083044  L 499.417268 343.863288  z " clip-path="url(#p653fc2883c)" style="fill: #27667b; stroke: #27667b; stroke-linecap: round" />
   <title>icts_micro_quarantine_contact_ratio → icts_macro_city_contact_change_on_quarantine_increase
upward

   <title>sic_micro_prior_setting_degree → icts_micro_quarantine_contact_ratio
intra_scale
A newly infected agent's prior same-setting contact degree can shape how many contacts are available for notification and how the agent's behavior changes when later quarantined; greater prior connectedness may imply a larger pre-onset contact set and a different potential post-onset contact reduction, thereby affecting the observed post/pre contact ratio.</title></g>

   <title>icts_micro_quarantine_contact_ratio → sic_micro_prior_setting_degree
intra_scale
Quarantine onset and the associated reduction in an agent's contacts remove that agent from ongoing setting-level mixing; this changes the pool and connectivity of remaining contacts available to susceptible agents, altering the prior same-setting contact degree observed for later infection events in those settings.</title></g>

intra_scale

   <title>icts_meso_layer_contact_change → sic_macro_layer_entropy
upward
Quarantine-associated contact-volume contractions that differ by layer redistribute mixing opportunities among settings, which can shift transmission toward less-contracted layers and thereby reshape the city-level distribution of infection events across layers.</title></g>

   <title>sic_macro_layer_entropy → icts_macro_city_contact_change_on_quarantine_increase

intra_scale
