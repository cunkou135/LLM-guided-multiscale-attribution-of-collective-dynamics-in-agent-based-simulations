default_profile: deepseek_flash_v2
profiles:
  deepseek_flash_v2:
    base_url: https://api.deepseek.com
    model: deepseek-flash
    temperature: 0.3
    max_tokens: 32768
    timeout: 600
    provider: openai_compatible
    api_key_env: STAGE1_SUPPLIED_CONFIG_API_KEY
    max_retries: 1
    reasoning_effort: low
    stream: true
    extra_body:
      stream_options:
        include_usage: true
